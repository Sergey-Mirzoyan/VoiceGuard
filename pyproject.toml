[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceguard"
version = "0.1.0"
description = "VoiceGuard AM - detection of synthesized Armenian speech in phone channels"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "pyarrow>=14.0.0,<20.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "librosa>=0.10.0,<1.0.0",
    "soundfile>=0.12.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1.0,<3.0.0",
]
speech = [
    "webrtcvad>=2.0.10,<3.0.0",
    "praat-parselmouth>=0.4.3,<1.0.0",
]
data = [
    "datasets>=2.16.0,<4.0.0",
    "huggingface-hub>=0.20.0,<1.0.0",
]
service = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "httpx>=0.26.0,<1.0.0",
    "websockets>=12.0,<14.0",
]
ui = [
    "streamlit>=1.30.0,<2.0.0",
    "plotly>=5.18.0,<6.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.3.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pre-commit>=3.6.0,<5.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
]

[dependency-groups]
ml = [
    "torch>=2.1.0,<3.0.0",
]
speech = [
    "webrtcvad>=2.0.10,<3.0.0",
    "praat-parselmouth>=0.4.3,<1.0.0",
]
data = [
    "datasets>=2.16.0,<4.0.0",
    "huggingface-hub>=0.20.0,<1.0.0",
]
service = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "httpx>=0.26.0,<1.0.0",
    "websockets>=12.0,<14.0",
]
ui = [
    "streamlit>=1.30.0,<2.0.0",
    "plotly>=5.18.0,<6.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.3.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pre-commit>=3.6.0,<5.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
]

[tool.uv]
default-groups = ["dev", "ml", "speech", "data", "service", "ui"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/voiceguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "docs",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "UP042",  # General TZ specifies `class Label(str, Enum):` verbatim
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "webrtcvad.*",
    "parselmouth.*",
    "soundfile.*",
    "librosa.*",
    "scipy.*",
    "sklearn.*",
    "pandas.*",
]
ignore_missing_imports = true
