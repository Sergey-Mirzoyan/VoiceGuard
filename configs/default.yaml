audio:
  sr_nb: 8000
  sr_wb: 16000
  frame_ms: 20
  segment_s: 1.0
vad:
  engine: webrtc          # webrtc | silero
  aggressiveness: 2
lpc:
  order_nb: 10
  order_wb: 16
  window: hamming
d2:
  windows: [8, 16, 32]
  directions: [fwd, bwd]
  modes: [bit, block]
  train_frac: 0.8         # непрерывное разбиение 80/20
  max_train: 5000         # ограничение обучающей выборки
  mlp_lr: 0.001
  seed: 42
  alpha: 0.01             # уровень значимости одиночного вердикта D2
  chi2_max_w: 8
channels:
  stage0: [clean, g711a, amrnb_12.2, amrnb_4.75, amrwb_12.65, amrnb_12.2+loss3]
channel:
  ffmpeg_cmd: "docker run --rm -i voiceguard-base:latest ffmpeg"
  noise_dir: null
  loss_model: "independent"  # independent | gilbert_elliott
  gilbert_elliott:
    p: 0.05
    r: 0.5
fusion:
  sprt_alpha: 0.001       # цель для демо; продуктовая цель 1e-4
  sprt_beta: 0.05
  t_max_s: 30
engine:
  stream_d2_checks: all   # all | reduced (см. ЧТЗ-09)
paths:
  data: data/
  models: data/models/
  reports: reports/
debug:
  save_audio: false
